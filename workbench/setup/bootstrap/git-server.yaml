# The git server Argo CD reads from. Pushing needs the admin key in ConfigMap
# git-admin-keys, which `just up` fills with the public half of its push key;
# the private half stays outside the repo, where the sandbox cannot read it.
# Reading is anonymous, so Argo CD needs no credential at all.
apiVersion: v1
kind: Namespace
metadata:
  name: git
---
# Survives a pod restart; without it Argo CD would lose its source.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soft-serve
  namespace: git
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soft-serve
  namespace: git
  labels:
    app: soft-serve
spec:
  replicas: 1
  # One writer on a ReadWriteOnce volume: the old pod must stop first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: soft-serve
  template:
    metadata:
      labels:
        app: soft-serve
    spec:
      containers:
        - name: soft-serve
          image: charmcli/soft-serve:v0.12.3@sha256:e8a12ff7f112558a6cd461ca192fe237d9deb2ec081ace944d2b5a61138a0db9
          env:
            - name: SOFT_SERVE_DATA_PATH
              value: /soft-serve
            - name: SOFT_SERVE_ANON_ACCESS
              value: read-only
            - name: SOFT_SERVE_SSH_PUBLIC_URL
              value: ssh://127.0.0.1:23231
            - name: SOFT_SERVE_INITIAL_ADMIN_KEYS
              valueFrom:
                configMapKeyRef:
                  name: git-admin-keys
                  key: keys
          ports:
            - containerPort: 23231 # ssh, push
            - containerPort: 23232 # http, anonymous read
          readinessProbe:
            tcpSocket:
              port: 23231
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /soft-serve
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soft-serve
---
apiVersion: v1
kind: Service
metadata:
  name: soft-serve
  namespace: git
spec:
  selector:
    app: soft-serve
  ports:
    - name: http
      port: 23232
---
# Push from the host, node port matching the k3d mapping in the justfile.
apiVersion: v1
kind: Service
metadata:
  name: soft-serve-ssh
  namespace: git
spec:
  type: NodePort
  selector:
    app: soft-serve
  ports:
    - name: ssh
      port: 23231
      nodePort: 30231
