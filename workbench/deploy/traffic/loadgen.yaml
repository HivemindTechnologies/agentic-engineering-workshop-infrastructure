# The outside world: customers calling the scoring API. Its traffic changes
# over HTTP; see ../../setup/loadgen/main.go for why that is not declared here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: workshop/loadgen
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: TARGET_URL
              value: http://scoring.demo.svc.cluster.local:8080/score
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
# Traffic control from the host, node port matching the k3d mapping in the
# justfile. Unauthenticated: anything on this machine can change the traffic.
apiVersion: v1
kind: Service
metadata:
  name: loadgen
spec:
  type: NodePort
  selector:
    app: loadgen
  ports:
    - port: 8081
      nodePort: 30081
